name: TrustLink CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  setup-node:
    name: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript & Unit Tests (385 tests)
        run: npm test

      - name: Build Web Application Bundle
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 7

  selenium-tests:
    name: selenium-tests
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Selenium Web E2E Scenarios
        run: node scripts/selenium-test.js

      - name: Upload Selenium Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: reports/selenium-report.json
          retention-days: 14

  appium-tests:
    name: appium-tests
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Appium Mobile E2E Scenarios
        run: node scripts/appium-test.js

      - name: Upload Appium Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: reports/appium-report.json
          retention-days: 14

  load-tests:
    name: load-tests
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Real-Time High-Throughput Load Benchmark
        run: node scripts/load-test.js

      - name: Upload Load Report
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: reports/load-report.json
          retention-days: 14

  security-assessment:
    name: security-assessment
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Automated OWASP & Vulnerability Security Audit
        run: node scripts/security-audit.js

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/security-report.json
          retention-days: 14

  summary:
    name: summary
    needs: [selenium-tests, appium-tests, load-tests, security-assessment]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
          merge-multiple: true

      - name: Generate Summary Report
        run: node scripts/generate-summary-report.js

      - name: Upload Final Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: summary-report
          path: reports/summary.*
          retention-days: 30
